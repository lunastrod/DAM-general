<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .navigation{
            background-color: #78ddfc;
            margin: 10px;
            
            width: 96%;
            height: 70px;
            position:fixed;
            top:0px;
            right:0px;
            left:0px;
            border-radius: 5px;
        }
        .dropdown{
            width: 100px;
            overflow: hidden;
            position: absolute;
            top:0px;
            bottom:0px;
            right:30px;
            border:1px solid rgb(255, 0, 0);
            background-color: #22cbff;
            list-style: none;
            margin: 0px;
        }
        .dropdown:hover{
            width: 200px;
            height: 300px;
        }
        .dropdown li{
            border:1px solid rgb(255, 0, 0);
            width: 100%;
            height: 50px;
            margin-bottom: 5px;
            margin-left: -20px;
            text-align: center;
        }
        .dropdown li:hover{
            background-color: rgb(103, 103, 255);
        }
        .dropdownIcon{
            height: 70px;
            border:1px solid rgb(255, 0, 0);
            margin: 0px;
            text-align: right;
            right: 10px;
            padding-right: 20px;
            padding-top: 20px;
        }

    </style>
</head>
<body>
    <nav class="navigation">
        <div>
            Icono
        </div>
        

            <ul class="dropdown">
                <div class="dropdownIcon">☰</div>
                <li>Opcion1</li>
                <li>Opcion1</li>
                <li>Opcion1</li>
                <li>Opcion1</li>
                <li>Opcion1</li>
                <li>Opcion1</li>
            </ul>


        </div>
    </nav>

        <script>
            for(let i=1;i<=2000;i++){
                document.write("Caja1-"+i+"<br>");
            }
        </script>
    </div>
    
</body>
</html>
