<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        .navigation{
            background-color: #27f5da;
            padding: 10px;
            width: 95%;
            height: 30px;
            position:fixed;
            top:10px;
            border:1px solid;
            border-radius: 20px;
        }
        .dropdown{
            width: 100px;
            /*height: 30px;*/
            padding: 10px;
            overflow: hidden;
            border:1px solid;
            position: absolute;
            /*
            top: 0px;
            left: 90%;*/
            top: 0px;
            right: 40px;
            bottom: 0px;
        }
        .dropdown:hover{
            width: 100px;
            height: 300px;
        }
        .dropdownIcon{
            border:1px solid;
            /*padding: 10px;*/
            width:100px;
            height: 40px;
        }
        .dropdownOption:hover{
            background-color: beige;
        }
        .dropdownOption{
            border:1px solid;
            width: 100px;
            height: 30px;
            margin:2px;
            text-align: center;
        }
        .optionText{
            align-self: center;
        }

    </style>
</head>
<body>
    <nav class="navigation">
        <div>
            Icono
        </div>
        
        <div class="dropdown">
            <div class="dropdownIcon">Menu</div>
            <div class="dropdownOption"><p class="optionText">Opcion1</p></div>
            <div class="dropdownOption"><p class="optionText">Opcion1</p></div>
            <div class="dropdownOption"><p class="optionText">Opcion1</p></div>
            <div class="dropdownOption"><p class="optionText">Opcion1</p></div>
            <div class="dropdownOption"><p class="optionText">Opcion1</p></div>
        </div>
    </nav>

    <div class="caja1">
        <script>
            for(let i=1;i<=2000;i++){
                document.write("Caja1-"+i+"<br>");
            }
        </script>
    </div>

</body>
</html>
