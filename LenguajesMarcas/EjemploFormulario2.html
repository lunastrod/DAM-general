<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <!--fieldset con datos personales-->
    <form action="procesadatos.php">
        <fieldset>
            <legend>Datos Personales</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" />
            <label for="apellido">Apellido:</label>
            <input type="text" name="apellido" />
            <label for="edad">Edad:</label>
            <input type="number" name="edad" />
        </fieldset>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Borrar" />
    </form>

    <!--controles de html5 con label-->
    <form>
        <fieldset>
            <label for="busqueda">Busqueda</label>
            <input type="search" name="busqueda" />
            <label for="range">range</label>
            <input type="range" name="range" min="0" max="100" />
            <label for="fecha">Fecha de Nacimiento:</label>
            <input type="date" name="fecha" />
            <label for="month" >Mes de Cumpleaños:</label>
            <input type="month" name="month" min="2021-04-01" step="1" />
            <label for="hora">Hora de Cita:</label>
            <input type="time" name="hora" step="900"/>
            <label for="color">Color Favorito:</label>
            <input type="color" name="color" />
        </fieldset>

        <input type="submit" value="Enviar" />
    
</body>
</html>
